<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geologic Time Scale Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .timeline-bar { transition: all 0.3s ease; cursor: pointer; }
  .timeline-bar:hover { filter: brightness(1.2); transform: scaleX(1.02); }
  .modal-overlay { backdrop-filter: blur(4px); }
  .extinction-marker { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #1f2937; }
  ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
  .zoom-transition { transition: all 0.5s ease; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<div class="max-w-5xl mx-auto p-4">
  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-amber-400 mb-2">Geologic Time Scale Explorer</h1>
    <p class="text-gray-400 text-sm">Click any period to explore life forms, key events, and mass extinctions</p>
  </div>

  <!-- Controls -->
  <div class="bg-gray-800 rounded-xl p-4 mb-6 flex flex-wrap gap-4 items-center justify-between">
    <div class="flex items-center gap-3">
      <label class="text-sm text-gray-300 font-medium" for="zoomSlider">Zoom Scale:</label>
      <input type="range" id="zoomSlider" min="0" max="1" step="0.01" value="0"
        class="w-48 accent-amber-400" aria-label="Zoom slider: 0=full 4600Ma, 1=Phanerozoic only">
      <span id="zoomLabel" class="text-amber-400 text-sm font-mono w-24">4600 Ma</span>
    </div>
    <div class="flex gap-2 flex-wrap">
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-green-700"></div><span class="text-xs text-gray-400">Hadean/Archean</span></div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-cyan-700"></div><span class="text-xs text-gray-400">Proterozoic</span></div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-blue-600"></div><span class="text-xs text-gray-400">Paleozoic</span></div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-emerald-600"></div><span class="text-xs text-gray-400">Mesozoic</span></div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-yellow-600"></div><span class="text-xs text-gray-400">Cenozoic</span></div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-red-600"></div><span class="text-xs text-gray-400">Extinction</span></div>
    </div>
  </div>

  <!-- Main Timeline -->
  <div class="flex gap-2">
    <!-- Ma axis -->
    <div id="maAxis" class="w-16 flex-shrink-0 relative" aria-hidden="true"></div>

    <!-- Eon column -->
    <div id="eonColumn" class="w-24 flex-shrink-0 relative"></div>

    <!-- Era column -->
    <div id="eraColumn" class="w-28 flex-shrink-0 relative"></div>

    <!-- Period column + events -->
    <div class="flex-1 relative">
      <div id="periodColumn" class="relative"></div>
      <div id="extinctionMarkers" class="absolute top-0 left-0 right-0 pointer-events-none"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 z-50 hidden flex items-center justify-center modal-overlay bg-black/60 p-4" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="bg-gray-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-gray-600 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h2 id="modalTitle" class="text-2xl font-bold"></h2>
        <p id="modalSubtitle" class="text-gray-400 text-sm mt-1"></p>
      </div>
      <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl leading-none" aria-label="Close modal">&times;</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// Geological data: [name, startMa, endMa, color, eon, era, life, events, endEvent]
const PERIODS = [

    events: ["Flowering plants diversify", "Atlantic Ocean opens", "High sea levels", "First ants and bees"],

  },
  {

    eon: "Phanerozoic", era: "Mesozoic",
    life: ["Brachiosaurus", "Stegosaurus", "Allosaurus", "Archaeopteryx (first bird)", "Pterosaurs"],
    events: ["Pangaea continues to split", "Morrison Formation fauna", "First birds evolve from theropods", "Giant sauropods dominate"],
    endEvent: null
  },
  {
    name: "Triassic", start: 251.9, end: 201.3, color: "#3d9e60",
    eon: "Phanerozoic", era: "Mesozoic",
    life: ["First dinosaurs", "Early mammals", "Ichthyosaurs", "Coelophysis"],
    events: ["Recovery after Permian extinction", "First mammals appear", "Pangaea begins to rift", "First coral reefs reform"],
    endEvent: "End-Triassic Extinction: Volcanic CAMP eruptions ~201 Ma — 80% of species lost"
  },
  {
    name: "Permian", start: 298.9, end: 251.9, color: "#e34a5c",
    eon: "Phanerozoic", era: "Paleozoic",
    life: ["Dimetrodon", "Synapsids (proto-mammals)", "Glossopteris flora", "Fusulinid foraminifera"],
    events: ["Pangaea fully assembled", "Coal swamps decline", "Reptiles diversify", "Glossopteris across Gondwana"],
    endEvent: "End-Permian (Great Dying) ~251.9 Ma — 96% of marine, 70% of land species extinct. Siberian Traps volcanism."
  },
  {
    name: "Carboniferous", start: 358.9, end: 298.9, color: "#7b68ee",
    eon: "Phanerozoic", era: "Paleozoic",
    life: ["Giant insects (Meganeura)", "Early reptiles", "Amphibians", "Lepidodendron forests"],
    events: ["Coal swamp forests form", "First amniotic egg", "Oxygen levels peak ~35%", "Ice age begins late Carboniferous"],
    endEvent: null
  },
  {

    eon: "Phanerozoic", era: "Paleozoic",
    life: ["Armored fish (Dunkleosteus)", "First tetrapods", "Ammonites appear", "First forests (Archaeopteris)"],
    events: ["Fish 'Age of Fishes'", "First land plants with roots", "First insects", "Tiktaalik — fish-tetrapod transition"],
    endEvent: "Late Devonian Extinction ~372 Ma — 75% of species extinct, multiple pulses"
  },
  {
    name: "Silurian", start: 443.8, end: 419.2, color: "#6495ed",
    eon: "Phanerozoic", era: "Paleozoic",
    life: ["Jawless fish", "Sea scorpions (Eurypterids)", "First land plants", "Coral reefs recover"],
    events: ["Coral reefs flourish", "Jawed fish appear", "Vascular plants colonize land", "Ozone layer forms"],
    endEvent: null
  },
  {
    name: "Ordovician", start: 485.4, end: 443.8, color: "#4682b4",
    eon: "Phanerozoic", era: "Paleozoic",
    life: ["Trilobites", "Graptolites", "Early nautiloids", "Jawless fish"],
    events: ["Marine invertebrate diversification", "First vertebrates with jaws", "Gondwana drifts south", "Baltic continent collisions"],
    endEvent: "End-Ordovician Extinction ~443.8 Ma — 85% of species extinct. Glaciation of Gondwana."
  },
  {
    name: "Cambrian", start: 538.8, end: 485.4, color: "#1e90ff",

    endEvent: null
  },
  {

    endEvent: null
  },

  },
  {
    name: "Tonian", start: 1000, end: 720, color: "#2e8b57",

    endEvent: null
  },
  {
    name: "Mesoproterozoic", start: 1600, end: 1000, color: "#3cb371",
    eon: "Proterozoic", era: "Mesoproterozoic",

    events: ["Supercontinent Rodinia assembles", "Eukaryotes with sexual reproduction", "Boring Billion begins"],

  },
  {
    name: "Paleoproterozoic", start: 2500, end: 1600, color: "#228b22",

    endEvent: null
  },
  {
    name: "Neoarchean", start: 2800, end: 2500, color: "#556b2f",
    eon: "Archean", era: "—",
    life: ["Stromatolites", "Cyanobacteria", "Anaerobic bacteria"],
    events: ["First continents stable", "Microbial mats widespread", "Oxygen begins to accumulate"],
    endEvent: null
  },
  {
    name: "Mesoarchean", start: 3200, end: 2800, color: "#6b8e23",
    eon: "Archean", era: "—",
    life: ["Stromatolites", "Methanogens"],
    events: ["Continent formation", "First stable cratons"],
    endEvent: null
  },
  {
    name: "Paleoarchean", start: 3600, end: 3200, color: "#808000",
    eon: "Archean", era: "—",
    life: ["Earliest known stromatolites", "Anaerobic prokaryotes"],
    events: ["Heavy Bombardment ends ~3.8 Ga", "First definitive microfossils"],
    endEvent: null
  },
  {
    name: "Eoarchean", start: 4000, end: 3600, color: "#8b8000",
    eon: "Archean", era: "—",
    life: ["Possibly first life"],
    events: ["Earliest crustal rocks (Acasta Gneiss ~4.0 Ga)", "Jack Hills zircons ~4.4 Ga", "Oceans form"],
    endEvent: null
  },
  {
    name: "Hadean", start: 4600, end: 4000, color: "#8b4513",
    eon: "Hadean", era: "—",
    life: ["No confirmed life"],
    events: ["Earth forms ~4.6 Ga", "Moon-forming impact ~4.5 Ga", "Late Heavy Bombardment", "Oceans begin to form ~4.4 Ga"],
    endEvent: null
  },
];

const EXTINCTIONS = [
  { name: "K-Pg Extinction", ma: 66, desc: "Chicxulub asteroid impact; 76% species extinct; end of non-avian dinosaurs" },
  { name: "End-Triassic", ma: 201.3, desc: "CAMP volcanism; ~80% species; opened niche for dinosaurs" },
  { name: "End-Permian (Great Dying)", ma: 251.9, desc: "Siberian Traps; 96% marine species, 70% land species; largest extinction" },
  { name: "Late Devonian", ma: 372, desc: "Multiple pulses over 25 Ma; 75% species; Kellwasser event" },
  { name: "End-Ordovician", ma: 443.8, desc: "Gondwana glaciation + sea level drop; 85% species extinct" },
];

let zoomValue = 0; // 0=full, 1=Phanerozoic only

function getDisplayRange() {
  const fullStart = 4600;
  const phanStart = 541;
  const start = fullStart - zoomValue * (fullStart - phanStart);
  return { start, end: 0 };
}

function renderTimeline() {
  const { start: displayStart } = getDisplayRange();
  const containerHeight = Math.max(600, window.innerHeight - 300);

  function maToPercent(ma) {
    return ((ma) / displayStart) * 100;
  }
  function maToHeight(ma) {
    return (ma / displayStart) * containerHeight;
  }

  // Filter visible periods
  const visible = PERIODS.filter(p => p.start <= displayStart);

  // Build Ma axis
  const maAxis = document.getElementById('maAxis');
  maAxis.style.height = containerHeight + 'px';
  const ticks = [];
  const step = displayStart < 100 ? 10 : displayStart < 600 ? 50 : displayStart < 2000 ? 200 : 500;
  for (let ma = 0; ma <= displayStart; ma += step) {
    const pct = maToPercent(ma);
    ticks.push(`<div class="absolute right-0 text-xs text-gray-500 font-mono" style="top:${pct}%;transform:translateY(-50%)">${ma}</div>`);
    ticks.push(`<div class="absolute right-0 w-2 border-t border-gray-600" style="top:${pct}%;"></div>`);
  }
  maAxis.innerHTML = `<div class="text-xs text-gray-500 text-center mb-1">Ma</div><div class="relative" style="height:${containerHeight}px;">${ticks.join('')}</div>`;

  // Eon column
  const eons = [{name:"Phanerozoic", start:538.8, end:0, color:"#1a3a5c"},
    {name:"Proterozoic", start:2500, end:538.8, color:"#1a4a3a"},
    {name:"Archean", start:4000, end:2500, color:"#2a3a1a"},
    {name:"Hadean", start:4600, end:4000, color:"#3a2a1a"}];
  const eonCol = document.getElementById('eonColumn');
  eonCol.innerHTML = `<div class="text-xs text-gray-400 text-center mb-1 font-semibold">EON</div><div class="relative" style="height:${containerHeight}px;">`;
  let eonHtml = `<div class="text-xs text-gray-400 text-center mb-1 font-semibold">EON</div><div class="relative" style="height:${containerHeight}px;">`;
  eons.forEach(eon => {
    const topMa = Math.min(eon.start, displayStart);
    const botMa = eon.end;
    if (topMa <= 0) return;
    const top = maToPercent(botMa);
    const height = maToPercent(topMa) - maToPercent(botMa);
    if (height <= 0) return;
    eonHtml += `<div class="absolute w-full flex items-center justify-center rounded overflow-hidden border border-gray-700 text-xs font-bold"
      style="top:${top}%;height:${Math.max(height,2)}%;background:${eon.color};writing-mode:vertical-rl;text-orientation:mixed;padding:4px 2px;">
      ${height > 3 ? eon.name : ''}
    </div>`;
  });
  eonHtml += '</div>';
  eonCol.innerHTML = eonHtml;

  // Era column
  const eras = [
    {name:"Cenozoic", start:66, end:0, color:"#7c5e10"},
    {name:"Mesozoic", start:251.9, end:66, color:"#1a5c2a"},
    {name:"Paleozoic", start:538.8, end:251.9, color:"#1a2a7c"},
    {name:"Neoproterozoic", start:1000, end:538.8, color:"#1a5c5c"},
    {name:"Mesoproterozoic", start:1600, end:1000, color:"#2a5c1a"},
    {name:"Paleoproterozoic", start:2500, end:1600, color:"#1a4c1a"},
    {name:"Archean", start:4000, end:2500, color:"#3a4a1a"},
    {name:"Hadean", start:4600, end:4000, color:"#5c3a1a"},
  ];
  let eraHtml = `<div class="text-xs text-gray-400 text-center mb-1 font-semibold">ERA</div><div class="relative" style="height:${containerHeight}px;">`;
  eras.forEach(era => {
    const topMa = Math.min(era.start, displayStart);
    const botMa = era.end;
    if (topMa <= 0) return;
    const top = maToPercent(botMa);
    const height = maToPercent(topMa) - maToPercent(botMa);
    if (height <= 0) return;
    eraHtml += `<div class="absolute w-full flex items-center justify-center rounded overflow-hidden border border-gray-600 text-xs font-semibold"
      style="top:${top}%;height:${Math.max(height,2)}%;background:${era.color};writing-mode:vertical-rl;text-orientation:mixed;padding:4px 2px;">
      ${height > 2 ? era.name : ''}
    </div>`;
  });
  eraHtml += '</div>';
  document.getElementById('eraColumn').innerHTML = eraHtml;

  // Period column
  let periodHtml = `<div class="text-xs text-gray-400 text-center mb-1 font-semibold">PERIOD / DURATION</div><div class="relative" style="height:${containerHeight}px;">`;
  visible.forEach(p => {
    const topMa = Math.min(p.start, displayStart);
    const botMa = p.end;
    const top = maToPercent(botMa);
    const height = maToPercent(topMa) - maToPercent(botMa);
    if (height <= 0) return;
    const duration = p.start - p.end;
    periodHtml += `<div class="timeline-bar absolute w-full rounded border border-gray-600/50 flex items-center px-2 overflow-hidden"
      role="button" tabindex="0" aria-label="Open details for ${p.name} period"
      onclick="openModal(${PERIODS.indexOf(p)})"
      onkeydown="if(event.key==='Enter'||event.key===' ')openModal(${PERIODS.indexOf(p)})"
      style="top:${top}%;height:${Math.max(height,1.5)}%;background:${p.color}22;border-left:4px solid ${p.color}">
      <span class="text-xs font-bold truncate" style="color:${p.color}">${p.name}</span>
      ${height > 2 ? `<span class="text-xs text-gray-400 ml-2 flex-shrink-0">${duration >= 100 ? (duration/1000).toFixed(2)+'Ga' : duration.toFixed(1)+'Ma'}</span>` : ''}
    </div>`;
  });

  // Extinction markers
  let extHtml = '';
  EXTINCTIONS.forEach(ext => {
    if (ext.ma > displayStart) return;
    const top = maToPercent(ext.ma);
    extHtml += `<div class="extinction-marker absolute left-0 right-0 flex items-center pointer-events-none"
      style="top:${top}%;z-index:10">
      <div class="w-full border-t-2 border-red-500 border-dashed opacity-70"></div>
      <span class="text-red-400 text-xs ml-1 whitespace-nowrap font-bold">💀 ${ext.name} (${ext.ma}Ma)</span>
    </div>`;
  });

  periodHtml += '</div>';
  document.getElementById('periodColumn').innerHTML = periodHtml;
  document.getElementById('extinctionMarkers').innerHTML = extHtml;
  document.getElementById('extinctionMarkers').style.height = containerHeight + 22 + 'px';
}

function openModal(idx) {
  const p = PERIODS[idx];
  document.getElementById('modalTitle').textContent = p.name;
  document.getElementById('modalTitle').style.color = p.color;
  document.getElementById('modalSubtitle').textContent = `${p.start} – ${p.end} Ma ago | Duration: ${(p.start - p.end).toFixed(1)} Ma | ${p.eon} Eon, ${p.era} Era`;

  let content = `
    <div class="space-y-4">
      <div>
        <h3 class="text-amber-400 font-semibold mb-2 flex items-center gap-2">
          <span>🦴</span> Notable Life Forms
        </h3>
        <ul class="list-disc list-inside space-y-1">
          ${p.life.map(l => `<li class="text-gray-300 text-sm">${l}</li>`).join('')}
        </ul>
      </div>
      <div>
        <h3 class="text-blue-400 font-semibold mb-2 flex items-center gap-2">
          <span>🌍</span> Key Events
        </h3>
        <ul class="list-disc list-inside space-y-1">
          ${p.events.map(e => `<li class="text-gray-300 text-sm">${e}</li>`).join('')}
        </ul>
      </div>
  `;

  if (p.endEvent) {
    content += `
      <div class="bg-red-900/30 border border-red-700 rounded-lg p-3">
        <h3 class="text-red-400 font-semibold mb-1 flex items-center gap-2"><span>💀</span> Mass Extinction Event</h3>
        <p class="text-red-200 text-sm">${p.endEvent}</p>
      </div>
    `;
  }

  // Time scale bar
  const pctOfHistory = ((p.start - p.end) / 4600 * 100).toFixed(1);
  content += `
    <div>
      <h3 class="text-gray-400 font-semibold mb-2 text-sm">Duration as % of Earth's history</h3>
      <div class="bg-gray-700 rounded-full h-3 overflow-hidden">
        <div class="h-full rounded-full" style="width:${pctOfHistory}%;background:${p.color}"></div>
      </div>
      <p class="text-gray-500 text-xs mt-1">${pctOfHistory}% of 4.6 billion years</p>
    </div>
  `;

  content += '</div>';
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').classList.remove('flex');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('zoomSlider').addEventListener('input', function() {
  zoomValue = parseFloat(this.value);
  const displayStart = 4600 - zoomValue * (4600 - 541);
  document.getElementById('zoomLabel').textContent = displayStart >= 1000
    ? (displayStart/1000).toFixed(2) + ' Ga'
    : Math.round(displayStart) + ' Ma';
  renderTimeline();
});

renderTimeline();
window.addEventListener('resize', renderTimeline);
</script>
</body>
</html>
